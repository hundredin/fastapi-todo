[tool.poetry]
name = "todo-app"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.128.0"
uvicorn = {extras = ["standard"], version = "^0.40.0"}
httpx = "^0.28.1"
requests = "^2.32.5"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.46"}
asyncpg = "^0.31.0"
psycopg = {extras = ["binary"], version = "^3.3.2"}
alembic = "^1.18.1"
black = "^26.1.0"
mypy = "^1.19.1"


[tool.poetry.group.dev.dependencies]
pytest-asyncio = "^1.3.0"
aiosqlite = "^0.22.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120

[tool.mypy]
mypy_path = "api"
check_untyped_defs = true
plugins = "sqlalchemy.ext.mypy.plugin"

[tool.isort]
line_length = 120
profile = "black"